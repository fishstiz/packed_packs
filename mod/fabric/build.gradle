import me.modmuss50.mpp.PublishOptions
import me.modmuss50.mpp.ReleaseType
import me.modmuss50.mpp.platforms.curseforge.CurseforgeOptions
import me.modmuss50.mpp.platforms.github.GithubOptions
import me.modmuss50.mpp.platforms.modrinth.ModrinthOptions

plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
    id 'publish-local'
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.frohnmeyer-wds.de/artifacts" }
}

dependencies {
    modApi(project(path: ":fidgetz:fabric"))
    include(project(path: ":fidgetz:fabric"))

    minecraft "com.mojang:minecraft:$minecraft_version"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-$parchment_minecraft:$parchment_version@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"

    // Mod Compatibility
    modCompileOnly "com.terraformersmc:modmenu:$modmenu_version"
    modLocalRuntime "com.terraformersmc:modmenu:$modmenu_version"

    compileOnly "maven.modrinth:resourcify:$resourcify_version"
    compileOnly "maven.modrinth:respackopts:$respackopts_version"
    compileOnly "io.gitlab.jfronny.libjf:libjf-resource-pack-entry-widgets-forge:$libjf_resource_pack_entry_widgets_version"
}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run/client')
        }
    }
}

publishMods {
    dryRun = rootProject["publishOptions"]["dryRun"] as boolean
    type = rootProject["publishOptions"]["type"] as ReleaseType
    changelog = rootProject["publishOptions"]["changelog"] as String

    def publishOptions = publishOptions {
        file = remapJar.archiveFile
        additionalFiles.from(remapSourcesJar.archiveFile)
        displayName = "Fabric v${this.version}"
        modLoaders.add("fabric")
    }

    github {
        from rootProject["publishOptions"]["github"] as Provider<GithubOptions>, publishOptions as Provider<PublishOptions>
        parent rootProject.tasks.named("publishGithub")
    }

    modrinth {
        from rootProject["publishOptions"]["modrinth"] as Provider<ModrinthOptions>, publishOptions as Provider<PublishOptions>
        requires("fabric-api")
    }

    curseforge {
        from rootProject["publishOptions"]["curseforge"] as Provider<CurseforgeOptions>, publishOptions as Provider<PublishOptions>
        requires("fabric-api")
    }
}
