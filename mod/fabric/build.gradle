plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
    id 'publish-local'
}

loom {
    def aw = file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('run/client')
            source sourceSets.main
        }
    }
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven { url = "https://maven.frohnmeyer-wds.de/artifacts" }
}

dependencies {
    modApi include("io.github.fishstiz.fidgetz:fidgetz-fabric:$fidgetz_version")

    api project(path: ":api:fabric", configuration: "namedElements")
    include(project(path: ":api:fabric"))

    minecraft "com.mojang:minecraft:$minecraft_version"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-$parchment_minecraft:$parchment_version@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"

    // Mod Compatibility
    modCompileOnly "com.terraformersmc:modmenu:$modmenu_version"
    modLocalRuntime "com.terraformersmc:modmenu:$modmenu_version"

    compileOnly "maven.modrinth:resourcify:$resourcify_version"
    compileOnly "maven.modrinth:respackopts:$respackopts_version"
    compileOnly "io.gitlab.jfronny.libjf:libjf-resource-pack-entry-widgets-forge:$libjf_resource_pack_entry_widgets_version"
    compileOnly "maven.modrinth:polytone:$polytone_version"
}

publishMods {
    dryRun = rootProject["publishOptions"]["dryRun"] as boolean
    type = rootProject["publishOptions"]["type"]
    changelog = rootProject["publishOptions"]["changelog"] as String

    def publishOptions = publishOptions {
        file = remapJar.archiveFile
        additionalFiles.from(remapSourcesJar.archiveFile)
        displayName = "Fabric v${this.version}"
        modLoaders.add("fabric")
    }

    github {
        from rootProject["publishOptions"]["github"]
        parent rootProject.tasks.named("publishGithub")
    }

    modrinth {
        from rootProject["publishOptions"]["modrinth"]
        requires("fabric-api")
    }

    curseforge {
        from rootProject["publishOptions"]["curseforge"]
        requires("fabric-api")
    }
}
