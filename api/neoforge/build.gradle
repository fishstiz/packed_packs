plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'publish-local'
}

loader {
    common = ':api:common'
}

neoForge {
    version = neoforge_version

    def at = project(loader.common).file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = "Maven for PR #3002" // https://github.com/neoforged/NeoForge/pull/3002
        url = uri("https://prmaven.neoforged.net/NeoForge/pr3002")
        content {
            includeModule("net.neoforged", "neoforge")
            includeModule("net.neoforged", "testframework")
        }
    }
}

dependencies {
    compileOnly project(path: ":fidgetz:neoforge")
}