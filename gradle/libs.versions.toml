[versions]
fidgetz = "0.5.4+26.2"

[libraries]
mixin = { module = "org.spongepowered:mixin", version = "0.8.7" }
mixin-extras = { module = "io.github.llamalad7:mixinextras-common", version = "0.5.0" }

fidgetz-common = { module = "io.github.fishstiz.fidgetz:fidgetz-common", version.ref = "fidgetz" }
fidgetz-fabric = { module = "io.github.fishstiz.fidgetz:fidgetz-fabric", version.ref = "fidgetz" }
fidgetz-neoforge = { module = "io.github.fishstiz.fidgetz:fidgetz-neoforge", version.ref = "fidgetz" }

modmenu = { module = "com.terraformersmc:modmenu", version = "20.0.0-alpha.1" }

resourcify = { module = "maven.modrinth:resourcify", version = "mrfZqvOq" }
polytone = { module = "maven.modrinth:polytone", version = "4TzQaJSC" }
respackopts = { module = "maven.modrinth:respackopts", version = "rvxfk9Zr" }
libjf-resourcePackEntryWidgets = { module = "dev.jfronny.libjf:libjf-resource-pack-entry-widgets-v0", version = "26.1.1-SNAPSHOT" }

[bundles]
mixin = ["mixin", "mixin-extras"]

respackopts = ["respackopts", "libjf-resourcePackEntryWidgets"]