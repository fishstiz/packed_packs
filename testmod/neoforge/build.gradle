plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

loader {
    commonPath = ':testmod:common'
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    mods {
        testmod {
            sourceSet sourceSets.main
        }
    }

    runs {
        testmodClient {
            type = "client"
            gameDirectory = project.file('run/testmod')
            ideName = "NeoForge Client Test ($project.path)"
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "fishstiz"
                url = "https://raw.githubusercontent.com/fishstiz/maven/m2"
            }
        }
        filter {
            includeModule("io.github.fishstiz", "minecraft-cursor-common-api")
            includeModule("io.github.fishstiz", "minecraft-cursor-neoforge")
        }
    }
}

dependencies {
    implementation project(":neoforge")

    localRuntime libs.minecraftCursor.neoforge
}