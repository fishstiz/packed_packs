plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

loader {
    commonPath = ':testmod:common'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "fishstiz"
                url = "https://raw.githubusercontent.com/fishstiz/maven/m2"
            }
        }
        filter {
            includeModule("io.github.fishstiz", "minecraft-cursor-fabric-api")
            includeModule("io.github.fishstiz", "minecraft-cursor-fabric")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Terraformers"
                url = "https://maven.terraformersmc.com/"
            }
        }
        filter {
            includeModule("com.terraformersmc", "modmenu")
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:$minecraft_version"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-$minecraft_version:$parchment_version@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"

    implementation project(path: ":fabric", configuration: "namedElements")

    modLocalRuntime libs.minecraftCursor.fabric
    modLocalRuntime libs.modmenu
}

loom {
    mods {
        testmod {
            sourceSet sourceSets.main
        }
    }

    runs {
        remove server

        client {
            client()
            setConfigName('Fabric Client Test')
            ideConfigGenerated(true)
            runDir('run/testmod')
            vmArg("-Dpacked_packs.debug")
        }
    }
}
