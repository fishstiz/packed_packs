plugins {
    id 'java-library'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "$archives_base_name-${project.name.replaceAll(/([a-z])([A-Z])/, '$1-$2').toLowerCase()}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = java_version.toInteger()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
}

tasks.named("sourcesJar", Jar) {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

processResources {
    var expandProps = [
            'root_mod_id'                     : rootProject.property('mod_id'),
            'mod_version'                     : mod_version,
            'mod_id'                          : mod_id,
            'mod_name'                        : mod_name,
            'mod_author'                      : mod_author,
            'mod_description'                 : mod_description,
            'license'                         : license,
            'sources'                         : sources,
            'issues'                          : issues,
            'minecraft_version'               : minecraft_version,
            'fabric_loader_version'           : fabric_loader_version,
            'fabric_api_version'              : fabric_api_version,
            'fabric_minecraft_version_range'  : fabric_minecraft_version_range,
            'neoforge_loader_version_range'   : neoforge_loader_version_range,
            'neoforge_version'                : neoforge_version,
            'neoforge_version_range'          : neoforge_version_range,
            'neoforge_minecraft_version_range': neoforge_minecraft_version_range,
            'credits'                         : credits,
            'java_version'                    : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

ext.commonJavaConfig = { String sourceSetName -> "common${sourceSetName.capitalize()}Java" }
ext.commonResourcesConfig = { String sourceSetName -> "common${sourceSetName.capitalize()}Resources" }